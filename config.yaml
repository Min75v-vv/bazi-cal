# 个人八字趋吉避凶日历配置
# ⚠️ 下面的出生信息、喜用神、忌神都是占位示例，请改成你自己的。

birth:
  # 出生证/家人记录的「钟表时间」（公历），不要自己先换算真太阳时
  year: 1990
  month: 5
  day: 20
  hour: 14
  minute: 30
  # 出生时所在地的 IANA 时区；程序据此自动处理当年的夏令时（如中国 1986–1991）
  timezone: Asia/Shanghai
  # 出生地经度，东经为正（北京约 116.40，上海约 121.47）
  longitude: 116.40

true_solar_time:
  # true = 经度时差 + 均时差（严格真太阳时）；false = 只校正经度（地方平太阳时）
  equation_of_time: true

# 晚子时（真太阳时 23:00–24:00）日柱：1 = 23 点即换日；2 = 晚子时日柱不换
zi_hour_sect: 1

# 五行只能写 木 火 土 金 水；两者不能重叠，未列出的五行视为闲神（不计分）
xiyong: [水, 金]
jishen: [火, 土]

# ---------------------------------------------------------------
# 评分规则 ——【示例值，非定论】请按你自己的判断调整
# 每日总分 = 五行喜忌分 + 与日柱关系分 + 与年柱关系分
# 同一天可能同时命中多项（如天克地冲 同时也算 地支六冲 和天干相克），分数会叠加
# ---------------------------------------------------------------
scoring:
  wuxing:              # 流日天干 / 地支（本气）五行
    gan_xiyong: 2
    gan_jishen: -2
    zhi_xiyong: 2
    zhi_jishen: -2
  day_pillar:          # 流日与我的日柱
    伏吟: -1
    天克地冲: -2
    天干五合: 1
    天干相冲: -1
    地支六冲: -3
    地支六合: 1
    地支半合: 1
    地支拱合: 0.5
    地支相刑: -1
    地支自刑: -1
    地支六害: -1
    地支六破: -0.5
  year_pillar:         # 流日与我的年柱
    伏吟: -0.5
    天克地冲: -1
    天干五合: 0.5
    天干相冲: -0.5
    地支六冲: -2
    地支六合: 0.5
    地支半合: 0.5
    地支拱合: 0
    地支相刑: -0.5
    地支自刑: -0.5
    地支六害: -0.5
    地支六破: 0
  thresholds:
    ji_min: 3          # 总分 ≥ 3 为「吉」
    xiong_max: -3      # 总分 ≤ -3 为「凶」，其余为「平」

calendar:
  name: 八字趋吉避凶
  timezone: Asia/Shanghai   # 「今天」按哪个时区算
  days: 365
  yiji_count: 2             # 标题里黄历宜、忌各取前几项
  uid_domain: rili-haoge.bazi
