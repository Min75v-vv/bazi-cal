# 个人八字趋吉避凶日历配置
# ⚠️ 下面的出生信息、喜用神、忌神都是占位示例，请改成你自己的。

birth:
  # 出生证/家人记录的「钟表时间」（公历），不要自己先换算真太阳时
  year: 1990
  month: 5
  day: 20
  hour: 14
  minute: 30
  # 出生时所在地的 IANA 时区；程序据此自动处理当年的夏令时（如中国 1986–1991）
  timezone: Asia/Shanghai
  # 出生地经度，东经为正（北京约 116.40，上海约 121.47）
  longitude: 116.40

true_solar_time:
  # true = 经度时差 + 均时差（严格真太阳时）；false = 只校正经度（地方平太阳时）
  equation_of_time: true

# 晚子时（真太阳时 23:00–24:00）日柱：1 = 23 点即换日；2 = 晚子时日柱不换
zi_hour_sect: 1

# ---------------------------------------------------------------
# 四维用神（评分规则移植自 oceanjustinlin/qimen，见 bazi_calendar/rules.py）
# 每项可写：十神（正印）、类别（印星 / 比劫 / 官杀 / 食伤 / 财星），或五行（水，按日主自动换算成类别）
# 同一十神出现在多层时，只算在最高层：用神 > 喜神 > 忌神 > 仇神；未列出的为闲神
#   用神：命局最需要的（药）        喜神：生扶用神的（援军）
#   忌神：克用神或伤日主的（病）    仇神：生助忌神的（援敌）
# ⚠️ 下面是占位示例，请改成你自己的
# ---------------------------------------------------------------
shen:
  yong: [水]
  xi: [金]
  ji: [土]
  chou: [火]

calendar:
  name: 八字趋吉避凶
  timezone: Asia/Shanghai   # 「今天」按哪个时区算
  days: 365
  yiji_count: 2             # 标题里黄历宜、忌各取前几项
